<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 68 92" role="img">
  <title>Avyanco Icon Mark</title>
  <desc>Three rising fins of increasing height on a base platform, in deep navy.</desc>

  <!-- Fin 1: Left, Shortest -->
  <path d="M 9,77 C 8,68 10,59 11.5,52 C 12.5,49 14.5,49 15.5,52 C 17,59 22,68 22,77 Z" fill="#0C1E45"/>
  <!-- Fin 2: Center, Medium -->
  <path d="M 27,77 C 25.5,62 27,47 29,34 C 30,30 33,30 34.5,34 C 36.5,47 38.5,62 40,77 Z" fill="#0C1E45"/>
  <!-- Fin 3: Right, Tallest -->
  <path d="M 44,77 C 42.5,55 44,30 47,8 C 48,4 52,4 53.5,8 C 56.5,30 58.5,55 60,77 Z" fill="#0C1E45"/>
  <!-- Base platform -->
  <rect x="7" y="77.5" width="55" height="2.5" rx="1.25" fill="#0C1E45"/>

</svg>